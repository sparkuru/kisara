[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisara"
version = "0.1.0"
description = "A bot with OneBot 11, official QQ and Telegram adapters."
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=10,<12",
    "websockets>=11,<14",
    "tomli>=2,<3; python_version<'3.11'",
]

[project.optional-dependencies]
telegram = [
    "python-telegram-bot==22.8",
]
official = [
    "qq-botpy==1.2.1",
]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kisara.resources" = ["foods.json", "chat_cute.csv", "chat_tsundere.csv", "chat_mixed.json", "tarot.json", "tarot_images.json", "tarot-LICENSE.txt", "legacy-LICENSE.txt", "SOURCES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

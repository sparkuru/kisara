services:
  napcat:
    profiles: [onebot, onebot-dev]
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    hostname: ${NAPCAT_HOSTNAME:-kisara-qq}
    mac_address: ${NAPCAT_MAC_ADDRESS:-02:42:0a:a0:d0:02}
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - /opt/kisara/napcat-entrypoint.sh
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-${KISARA_HOST_UID:-1000}}
      NAPCAT_GID: ${NAPCAT_GID:-${KISARA_HOST_GID:-1000}}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
    ports:
      - "${NAPCAT_WEBUI_BIND:-127.0.0.1}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./napcat-entrypoint.sh:/opt/kisara/napcat-entrypoint.sh:ro
      - ../data/napcat/config:/app/napcat/config
      - ../data/napcat/QQ:/app/.config/QQ
      - ../data/kisara/tarotCards:/app/tarot-cards:ro
    networks:
      - kisara_network

  music:
    profiles:
      - music
    image: ${KISARA_MUSIC_IMAGE:-moefurina/ncm-api:latest}
    restart: unless-stopped
    networks:
      - kisara_network

  kisara:
    profiles: [onebot]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    group_add:
      - "${ONEBOT_SETU_GID-${KISARA_SETU_GID:-${KISARA_HOST_GID:-1000}}}"
    environment:
      KISARA_PING_ENABLED: ${ONEBOT_PING_ENABLED-${KISARA_PING_ENABLED:-true}}
      KISARA_HELP_ENABLED: ${ONEBOT_HELP_ENABLED-${KISARA_HELP_ENABLED:-true}}
      KISARA_MUSIC_ENABLED: ${ONEBOT_MUSIC_ENABLED-${KISARA_MUSIC_ENABLED:-true}}
      KISARA_NEWS_ENABLED: ${ONEBOT_NEWS_ENABLED-${KISARA_NEWS_ENABLED:-true}}
      KISARA_NEWS_PUSH_ENABLED: ${ONEBOT_NEWS_PUSH_ENABLED-${KISARA_NEWS_PUSH_ENABLED:-true}}
      KISARA_ENGINE: onebot
      KISARA_INSTANCE_ID: ${ONEBOT_INSTANCE_ID-${KISARA_INSTANCE_ID:-personal}}
      KISARA_ALLOWED_USERS: ${ONEBOT_ALLOWED_USERS-${KISARA_ALLOWED_USERS:-}}
      KISARA_ADMIN_USERS: ${ONEBOT_ADMIN_USERS-${KISARA_ADMIN_USERS:-}}
      KISARA_GROUPS_ENABLED: ${ONEBOT_GROUPS_ENABLED-${KISARA_GROUPS_ENABLED:-false}}
      KISARA_ALLOWED_GROUPS: ${ONEBOT_ALLOWED_GROUPS-${KISARA_ALLOWED_GROUPS:-}}
      KISARA_CHAT_ENABLED: ${ONEBOT_CHAT_ENABLED-${KISARA_CHAT_ENABLED:-true}}
      KISARA_CHAT_BOT_NAME: ${ONEBOT_CHAT_BOT_NAME-${KISARA_CHAT_BOT_NAME:-Kisara}}
      KISARA_CHAT_SENDER_NAME: ${ONEBOT_CHAT_SENDER_NAME-${KISARA_CHAT_SENDER_NAME:-you}}
      KISARA_CHAT_LIBRARY: ${ONEBOT_CHAT_LIBRARY-${KISARA_CHAT_LIBRARY:-cute}}
      KISARA_CHAT_TRIGGER_RATE: ${ONEBOT_CHAT_TRIGGER_RATE-${KISARA_CHAT_TRIGGER_RATE:-30}}
      KISARA_CHAT_SIMILARITY_RATE: ${ONEBOT_CHAT_SIMILARITY_RATE-${KISARA_CHAT_SIMILARITY_RATE:-60}}
      KISARA_CHAT_IGNORED_PHRASES: ${ONEBOT_CHAT_IGNORED_PHRASES-${KISARA_CHAT_IGNORED_PHRASES:-}}
      KISARA_CHAT_BANNED_USERS: ${ONEBOT_CHAT_BANNED_USERS-${KISARA_CHAT_BANNED_USERS:-}}
      KISARA_CHAT_ALWAYS_REPLY_USERS: ${ONEBOT_CHAT_ALWAYS_REPLY_USERS-${KISARA_CHAT_ALWAYS_REPLY_USERS:-}}
      KISARA_CHAT_REPLY_TO_MENTIONS: ${ONEBOT_CHAT_REPLY_TO_MENTIONS-${KISARA_CHAT_REPLY_TO_MENTIONS:-true}}
      KISARA_TAROT_ENABLED: ${ONEBOT_TAROT_ENABLED-${KISARA_TAROT_ENABLED:-true}}
      KISARA_TAROT_SPREAD_RATE: ${ONEBOT_TAROT_SPREAD_RATE-${KISARA_TAROT_SPREAD_RATE:-5}}
      KISARA_TAROT_IMAGE_DIR: /app/tarot-cards
      SAUCENAO_API_KEY: ${ONEBOT_SAUCENAO_API_KEY-${SAUCENAO_API_KEY:-}}
      KISARA_MUSIC_API_URL: ${ONEBOT_MUSIC_API_URL-${KISARA_MUSIC_API_URL:-}}
      TIANAPI_KEY: ${ONEBOT_TIANAPI_KEY-${TIANAPI_KEY:-}}
      KISARA_NEWS_PUSH_GROUPS: ${ONEBOT_NEWS_PUSH_GROUPS-${KISARA_NEWS_PUSH_GROUPS:-}}
      KISARA_NEWS_PUSH_USERS: ${ONEBOT_NEWS_PUSH_USERS-${KISARA_NEWS_PUSH_USERS:-}}
      KISARA_NEWS_PUSH_TIME: ${ONEBOT_NEWS_PUSH_TIME-${KISARA_NEWS_PUSH_TIME:-10:30}}
      KISARA_NEWS_CACHE_DIR: /app/state/daily-news
      KISARA_STATE_DIR: /app/state
      ONEBOT_WS_URL: ${ONEBOT_WS_URL:-ws://napcat:3001}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
    depends_on:
      - napcat
    volumes:
      - ../config:/app/config:ro
      - ../data/kisara/tarotCards:/app/tarot-cards:ro
      - ../data/napcat/QQ:/app/.config/QQ:ro
      - kisara_state:/app/state
      - ../data/kisara/setu:/app/setu
    networks:
      - kisara_network

  kisara-dev:
    profiles: [onebot-dev]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    group_add:
      - "${ONEBOT_SETU_GID-${KISARA_SETU_GID:-${KISARA_HOST_GID:-1000}}}"
    command: ["/opt/kisara/kisara-dev-watch.sh"]
    environment:
      KISARA_PING_ENABLED: ${ONEBOT_PING_ENABLED-${KISARA_PING_ENABLED:-true}}
      KISARA_HELP_ENABLED: ${ONEBOT_HELP_ENABLED-${KISARA_HELP_ENABLED:-true}}
      KISARA_MUSIC_ENABLED: ${ONEBOT_MUSIC_ENABLED-${KISARA_MUSIC_ENABLED:-true}}
      KISARA_NEWS_ENABLED: ${ONEBOT_NEWS_ENABLED-${KISARA_NEWS_ENABLED:-true}}
      KISARA_NEWS_PUSH_ENABLED: ${ONEBOT_NEWS_PUSH_ENABLED-${KISARA_NEWS_PUSH_ENABLED:-true}}
      KISARA_ENGINE: onebot
      KISARA_INSTANCE_ID: ${ONEBOT_INSTANCE_ID-${KISARA_INSTANCE_ID:-personal}}
      KISARA_ALLOWED_USERS: ${ONEBOT_ALLOWED_USERS-${KISARA_ALLOWED_USERS:-}}
      KISARA_ADMIN_USERS: ${ONEBOT_ADMIN_USERS-${KISARA_ADMIN_USERS:-}}
      KISARA_GROUPS_ENABLED: ${ONEBOT_GROUPS_ENABLED-${KISARA_GROUPS_ENABLED:-false}}
      KISARA_ALLOWED_GROUPS: ${ONEBOT_ALLOWED_GROUPS-${KISARA_ALLOWED_GROUPS:-}}
      KISARA_CHAT_ENABLED: ${ONEBOT_CHAT_ENABLED-${KISARA_CHAT_ENABLED:-true}}
      KISARA_CHAT_BOT_NAME: ${ONEBOT_CHAT_BOT_NAME-${KISARA_CHAT_BOT_NAME:-Kisara}}
      KISARA_CHAT_SENDER_NAME: ${ONEBOT_CHAT_SENDER_NAME-${KISARA_CHAT_SENDER_NAME:-you}}
      KISARA_CHAT_LIBRARY: ${ONEBOT_CHAT_LIBRARY-${KISARA_CHAT_LIBRARY:-cute}}
      KISARA_CHAT_TRIGGER_RATE: ${ONEBOT_CHAT_TRIGGER_RATE-${KISARA_CHAT_TRIGGER_RATE:-30}}
      KISARA_CHAT_SIMILARITY_RATE: ${ONEBOT_CHAT_SIMILARITY_RATE-${KISARA_CHAT_SIMILARITY_RATE:-60}}
      KISARA_CHAT_IGNORED_PHRASES: ${ONEBOT_CHAT_IGNORED_PHRASES-${KISARA_CHAT_IGNORED_PHRASES:-}}
      KISARA_CHAT_BANNED_USERS: ${ONEBOT_CHAT_BANNED_USERS-${KISARA_CHAT_BANNED_USERS:-}}
      KISARA_CHAT_ALWAYS_REPLY_USERS: ${ONEBOT_CHAT_ALWAYS_REPLY_USERS-${KISARA_CHAT_ALWAYS_REPLY_USERS:-}}
      KISARA_CHAT_REPLY_TO_MENTIONS: ${ONEBOT_CHAT_REPLY_TO_MENTIONS-${KISARA_CHAT_REPLY_TO_MENTIONS:-true}}
      KISARA_TAROT_ENABLED: ${ONEBOT_TAROT_ENABLED-${KISARA_TAROT_ENABLED:-true}}
      KISARA_TAROT_SPREAD_RATE: ${ONEBOT_TAROT_SPREAD_RATE-${KISARA_TAROT_SPREAD_RATE:-5}}
      KISARA_TAROT_IMAGE_DIR: /app/tarot-cards
      SAUCENAO_API_KEY: ${ONEBOT_SAUCENAO_API_KEY-${SAUCENAO_API_KEY:-}}
      KISARA_MUSIC_API_URL: ${ONEBOT_MUSIC_API_URL-${KISARA_MUSIC_API_URL:-}}
      TIANAPI_KEY: ${ONEBOT_TIANAPI_KEY-${TIANAPI_KEY:-}}
      KISARA_NEWS_PUSH_GROUPS: ${ONEBOT_NEWS_PUSH_GROUPS-${KISARA_NEWS_PUSH_GROUPS:-}}
      KISARA_NEWS_PUSH_USERS: ${ONEBOT_NEWS_PUSH_USERS-${KISARA_NEWS_PUSH_USERS:-}}
      KISARA_NEWS_PUSH_TIME: ${ONEBOT_NEWS_PUSH_TIME-${KISARA_NEWS_PUSH_TIME:-10:30}}
      KISARA_NEWS_CACHE_DIR: /app/state/daily-news
      KISARA_STATE_DIR: /app/state
      ONEBOT_WS_URL: ${ONEBOT_WS_URL:-ws://napcat:3001}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      PYTHONPATH: /app/src
      KISARA_WATCH_ROOT: /app/src
      KISARA_WATCH_INTERVAL: ${ONEBOT_WATCH_INTERVAL-${KISARA_WATCH_INTERVAL:-0.5}}
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../data/kisara/tarotCards:/app/tarot-cards:ro
      - ../data/napcat/QQ:/app/.config/QQ:ro
      - kisara_state:/app/state
      - ../data/kisara/setu:/app/setu
    depends_on:
      - napcat
    networks:
      - kisara_network

  telegram:
    profiles: [telegram]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        KISARA_EXTRA: telegram
    restart: unless-stopped
    environment:
      KISARA_ENGINE: telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN-}
      TELEGRAM_MESSAGE_LOG_ENABLED: ${TELEGRAM_MESSAGE_LOG_ENABLED-false}
      KISARA_INSTANCE_ID: ${TELEGRAM_INSTANCE_ID-telegram}
      KISARA_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS-}
      KISARA_ADMIN_USERS: ${TELEGRAM_ADMIN_USERS-}
      KISARA_GROUPS_ENABLED: ${TELEGRAM_GROUPS_ENABLED-false}
      KISARA_ALLOWED_GROUPS: ${TELEGRAM_ALLOWED_GROUPS-}
      KISARA_PING_ENABLED: ${TELEGRAM_PING_ENABLED-true}
      KISARA_HELP_ENABLED: ${TELEGRAM_HELP_ENABLED-true}
      KISARA_MUSIC_ENABLED: ${TELEGRAM_MUSIC_ENABLED-true}
      KISARA_NEWS_ENABLED: ${TELEGRAM_NEWS_ENABLED-true}
      KISARA_NEWS_PUSH_ENABLED: ${TELEGRAM_NEWS_PUSH_ENABLED-true}
      KISARA_MUSIC_API_URL: ${TELEGRAM_MUSIC_API_URL-}
      KISARA_NEWS_PUSH_GROUPS: ${TELEGRAM_NEWS_PUSH_GROUPS-}
      KISARA_NEWS_PUSH_USERS: ${TELEGRAM_NEWS_PUSH_USERS-}
      KISARA_NEWS_PUSH_TIME: ${TELEGRAM_NEWS_PUSH_TIME-10:30}
      KISARA_NEWS_CACHE_DIR: /app/state/daily-news
      KISARA_STATE_DIR: /app/state
    volumes:
      - ../config/telegram:/app/config:ro
      - telegram_state:/app/state
    networks:
      - kisara_network

  official:
    profiles: [official]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        KISARA_EXTRA: official
    restart: unless-stopped
    environment:
      KISARA_ENGINE: official
      AppID: ${OFFICIAL_APP_ID-${AppID:-}}
      AppSecret: ${OFFICIAL_APP_SECRET-${AppSecret:-}}
      KISARA_INSTANCE_ID: ${OFFICIAL_INSTANCE_ID-official}
      KISARA_ALLOWED_USERS: ${OFFICIAL_ALLOWED_USERS-}
      KISARA_GROUPS_ENABLED: ${OFFICIAL_GROUPS_ENABLED-false}
      KISARA_ALLOWED_GROUPS: ${OFFICIAL_ALLOWED_GROUPS-}
      KISARA_PING_ENABLED: ${OFFICIAL_PING_ENABLED-true}
      KISARA_HELP_ENABLED: ${OFFICIAL_HELP_ENABLED-true}
      KISARA_MUSIC_ENABLED: ${OFFICIAL_MUSIC_ENABLED-true}
      KISARA_NEWS_ENABLED: ${OFFICIAL_NEWS_ENABLED-true}
      KISARA_NEWS_PUSH_ENABLED: "false"
      KISARA_MUSIC_API_URL: ${OFFICIAL_MUSIC_API_URL-}
      KISARA_NEWS_CACHE_DIR: /app/state/daily-news
      KISARA_STATE_DIR: /app/state
    volumes:
      - ../config/official:/app/config:ro
      - official_state:/app/state
    networks:
      - kisara_network

networks:
  kisara_network:
    driver: bridge

volumes:
  kisara_state:
  telegram_state:
  official_state:

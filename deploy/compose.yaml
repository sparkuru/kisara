services:
  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    hostname: ${NAPCAT_HOSTNAME:-kisara-qq}
    mac_address: ${NAPCAT_MAC_ADDRESS:-02:42:0a:a0:d0:02}
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - /opt/kisara/napcat-entrypoint.sh
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
    ports:
      - "${NAPCAT_WEBUI_BIND:-127.0.0.1}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./napcat-entrypoint.sh:/opt/kisara/napcat-entrypoint.sh:ro
      - ../data/napcat/config:/app/napcat/config
      - ../data/napcat/QQ:/app/.config/QQ
      - ../data/kisara/tarotCards:/app/tarot-cards:ro
    networks:
      - kisara_network

  music:
    profiles:
      - music
    image: ${KISARA_MUSIC_IMAGE:-moefurina/ncm-api:latest}
    restart: unless-stopped
    networks:
      - kisara_network

  kisara:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    group_add:
      - "${KISARA_SETU_GID:-1000}"
    environment:
      KISARA_ENGINE: onebot
      KISARA_INSTANCE_ID: ${KISARA_INSTANCE_ID:-personal}
      KISARA_ALLOWED_USERS: ${KISARA_ALLOWED_USERS:-}
      KISARA_ADMIN_USERS: ${KISARA_ADMIN_USERS:-}
      KISARA_GROUPS_ENABLED: ${KISARA_GROUPS_ENABLED:-false}
      KISARA_ALLOWED_GROUPS: ${KISARA_ALLOWED_GROUPS:-}
      KISARA_CHAT_ENABLED: ${KISARA_CHAT_ENABLED:-true}
      KISARA_CHAT_BOT_NAME: ${KISARA_CHAT_BOT_NAME:-Kisara}
      KISARA_CHAT_SENDER_NAME: ${KISARA_CHAT_SENDER_NAME:-you}
      KISARA_CHAT_LIBRARY: ${KISARA_CHAT_LIBRARY:-cute}
      KISARA_CHAT_TRIGGER_RATE: ${KISARA_CHAT_TRIGGER_RATE:-30}
      KISARA_CHAT_SIMILARITY_RATE: ${KISARA_CHAT_SIMILARITY_RATE:-60}
      KISARA_CHAT_IGNORED_PHRASES: ${KISARA_CHAT_IGNORED_PHRASES:-}
      KISARA_CHAT_BANNED_USERS: ${KISARA_CHAT_BANNED_USERS:-}
      KISARA_CHAT_ALWAYS_REPLY_USERS: ${KISARA_CHAT_ALWAYS_REPLY_USERS:-}
      KISARA_CHAT_REPLY_TO_MENTIONS: ${KISARA_CHAT_REPLY_TO_MENTIONS:-true}
      KISARA_TAROT_ENABLED: ${KISARA_TAROT_ENABLED:-true}
      KISARA_TAROT_SPREAD_RATE: ${KISARA_TAROT_SPREAD_RATE:-5}
      KISARA_TAROT_IMAGE_DIR: /app/tarot-cards
      SAUCENAO_API_KEY: ${SAUCENAO_API_KEY:-}
      KISARA_MUSIC_API_URL: ${KISARA_MUSIC_API_URL:-}
      TIANAPI_KEY: ${TIANAPI_KEY:-}
      KISARA_NEWS_PUSH_GROUPS: ${KISARA_NEWS_PUSH_GROUPS:-}
      KISARA_NEWS_PUSH_TIME: ${KISARA_NEWS_PUSH_TIME:-10:30}
      KISARA_NEWS_CACHE_DIR: /app/state/daily-news
      KISARA_STATE_DIR: /app/state
      ONEBOT_WS_URL: ${ONEBOT_WS_URL:-ws://napcat:3001}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
    depends_on:
      - napcat
    volumes:
      - ../config:/app/config:ro
      - ../data/kisara/tarotCards:/app/tarot-cards:ro
      - ../data/napcat/QQ:/app/.config/QQ:ro
      - kisara_state:/app/state
      - ../data/kisara/setu:/app/setu
    networks:
      - kisara_network

  kisara-dev:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    group_add:
      - "${KISARA_SETU_GID:-1000}"
    command: ["/opt/kisara/kisara-dev-watch.sh"]
    environment:
      KISARA_ENGINE: onebot
      KISARA_INSTANCE_ID: ${KISARA_INSTANCE_ID:-personal}
      KISARA_ALLOWED_USERS: ${KISARA_ALLOWED_USERS:-}
      KISARA_ADMIN_USERS: ${KISARA_ADMIN_USERS:-}
      KISARA_GROUPS_ENABLED: ${KISARA_GROUPS_ENABLED:-false}
      KISARA_ALLOWED_GROUPS: ${KISARA_ALLOWED_GROUPS:-}
      KISARA_CHAT_ENABLED: ${KISARA_CHAT_ENABLED:-true}
      KISARA_CHAT_BOT_NAME: ${KISARA_CHAT_BOT_NAME:-Kisara}
      KISARA_CHAT_SENDER_NAME: ${KISARA_CHAT_SENDER_NAME:-you}
      KISARA_CHAT_LIBRARY: ${KISARA_CHAT_LIBRARY:-cute}
      KISARA_CHAT_TRIGGER_RATE: ${KISARA_CHAT_TRIGGER_RATE:-30}
      KISARA_CHAT_SIMILARITY_RATE: ${KISARA_CHAT_SIMILARITY_RATE:-60}
      KISARA_CHAT_IGNORED_PHRASES: ${KISARA_CHAT_IGNORED_PHRASES:-}
      KISARA_CHAT_BANNED_USERS: ${KISARA_CHAT_BANNED_USERS:-}
      KISARA_CHAT_ALWAYS_REPLY_USERS: ${KISARA_CHAT_ALWAYS_REPLY_USERS:-}
      KISARA_CHAT_REPLY_TO_MENTIONS: ${KISARA_CHAT_REPLY_TO_MENTIONS:-true}
      KISARA_TAROT_ENABLED: ${KISARA_TAROT_ENABLED:-true}
      KISARA_TAROT_SPREAD_RATE: ${KISARA_TAROT_SPREAD_RATE:-5}
      KISARA_TAROT_IMAGE_DIR: /app/tarot-cards
      SAUCENAO_API_KEY: ${SAUCENAO_API_KEY:-}
      KISARA_MUSIC_API_URL: ${KISARA_MUSIC_API_URL:-}
      TIANAPI_KEY: ${TIANAPI_KEY:-}
      KISARA_NEWS_PUSH_GROUPS: ${KISARA_NEWS_PUSH_GROUPS:-}
      KISARA_NEWS_PUSH_TIME: ${KISARA_NEWS_PUSH_TIME:-10:30}
      KISARA_NEWS_CACHE_DIR: /app/state/daily-news
      KISARA_STATE_DIR: /app/state
      ONEBOT_WS_URL: ${ONEBOT_WS_URL:-ws://napcat:3001}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      PYTHONPATH: /app/src
      KISARA_WATCH_ROOT: /app/src
      KISARA_WATCH_INTERVAL: ${KISARA_WATCH_INTERVAL:-0.5}
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../data/kisara/tarotCards:/app/tarot-cards:ro
      - ../data/napcat/QQ:/app/.config/QQ:ro
      - kisara_state:/app/state
      - ../data/kisara/setu:/app/setu
    depends_on:
      - napcat
    networks:
      - kisara_network

networks:
  kisara_network:
    driver: bridge

volumes:
  kisara_state:
